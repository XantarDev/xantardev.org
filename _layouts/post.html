---
layout: default
---
<article class="post">
  <h1>{{ page.title | escape }}</h1>
  <p class="entry-meta"><time datetime="{{ page.date | date_to_xmlschema }}">📆 {{ page.date | date: '%d/%m/%Y' }}</time>{% if page.author %} · 👤 {{ page.author | escape }}{% endif %}</p>
  <div class="entry-content">{{ content }}</div>
</article>
