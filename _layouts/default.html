<!doctype html>
<html lang="{{ site.lang | default: 'gl-ES' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="inner-wrap">
      <div class="brand">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p>{{ site.description }}</p>
      </div>
      <nav class="main-navigation" aria-label="Principal">
        <a href="{{ '/xd/' | relative_url }}">¿Qué es XantarDev?</a>
        <a href="{{ '/codigo-de-conducta/' | relative_url }}">Código de conducta</a>
      </nav>
    </div>
  </header>
  <main class="inner-wrap content" id="main">{{ content }}</main>
  <footer class="site-footer"><div class="inner-wrap">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</div></footer>
</body>
</html>
