strict_tdd: false
context: |
  xantardev.org is an effectively empty website repository intended to replace the owner's existing WordPress site with GitHub Pages.
  The selected migration source is an official WordPress XML export; an untracked export file is currently present at the repository root and must be validated during exploration before it is treated as authoritative input.
  Jekyll is the provisional engine because GitHub Pages supports it natively, Markdown/frontmatter keeps future manual article authoring simple, and Jekyll permits WordPress-style permalink control.
  The migration must preserve every existing public URL for articles, images, downloads, and other linked resources so social-media and third-party links continue to resolve.
  The current WordPress visual design should be reproduced closely; migration automation and design details remain to be specified in later SDD phases.
  Repository markers currently include README.md, a GitHub-Pages-oriented .gitignore, and no application, dependency manifest, CI workflow, test suite, or generated site.
  No reliable test runner is available yet. Ruby, Bundler, and Jekyll are not installed in the inspected environment; Node.js and Git are available.
  Verification must later include focused automated checks plus a complete source-to-output URL manifest comparison, internal-link and asset checks, and local Jekyll build validation once tooling is established.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: ""
  verify:
    test_command: ""
